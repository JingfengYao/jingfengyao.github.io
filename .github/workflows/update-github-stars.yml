name: Update GitHub stars

on:
  schedule:
    # 08:23 in Asia/Shanghai. An off-peak minute reduces scheduling delays.
    - cron: "23 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-github-stars
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh star counts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/update-github-stars.mjs

      - name: Commit the refreshed cache
        run: |
          if git diff --quiet -- data/github-stars-cache.json; then
            echo "Star cache is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/github-stars-cache.json
          git commit -m "chore: update GitHub star counts"
          git push
